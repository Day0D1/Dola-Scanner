services:
  - type: web
    name: dola-scanner
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /api/scan
    disk:
      name: dola-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: POLYGON_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: USE_FULL_UNIVERSE
        value: "true"
      - key: SCAN_WORKERS
        value: "16"
