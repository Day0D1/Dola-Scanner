<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dola - Time Series {{ ticker }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}" />
  <link rel="stylesheet" href="/static/chart_settings.css?v={{ asset_v }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Dola</span>
      <span class="brand-sub">Time Series: <span id="fvTicker">{{ ticker }}</span></span>
    </div>
    <div class="topbar-actions">
      <div class="ticker-search">
        <input id="fvSearchInput" class="search" type="search" placeholder="Search another ticker..." autocomplete="off" />
        <ul id="fvSearchResults" class="ticker-search-results hidden"></ul>
      </div>
      <a href="/" class="btn ghost">Dashboard</a>
      <button id="fvZoomOut" class="btn ghost fv-zoom" title="Zoom out (show more days)">-</button>
      <select id="fvDays" class="select">
        <option value="30">30 days</option>
        <option value="60">60 days</option>
        <option value="90" selected>90 days</option>
        <option value="180">180 days</option>
        <option value="270">270 days</option>
        <option value="252">1 year</option>
        <option value="378">1.5 years</option>
        <option value="504">2 years</option>
      </select>
      <button id="fvZoomIn" class="btn ghost fv-zoom" title="Zoom in (show fewer days)">+</button>
      <a id="fvExport" class="btn primary" href="#">Export Excel</a>
      <button id="fvRefresh" class="btn">Refresh</button>
      <button type="button" class="btn ghost" id="tsSettingsBtn"
              title="Time Series colors"
              onclick="window.openTsSettings && window.openTsSettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>
        </svg>Colors
      </button>
    </div>
  </header>

  <section class="section">
    <div class="fv-legend">
      <span class="fv-swatch bb-upper">H</span> BB upper
      <span class="fv-swatch bb-middle">F</span> BB middle (fair value)
      <span class="fv-swatch bb-lower">L</span> BB lower
      <span class="fv-swatch close"></span> Close (standalone)
      <span class="fv-swatch close-on-upper"></span> Close at upper
      <span class="fv-swatch close-on-mid"></span> Close at fair value
      <span class="fv-swatch close-on-lower"></span> Close at lower
      <span class="fv-swatch range"></span> Intraday range
    </div>
    <div id="fvContainer" class="fv-container">
      <div id="fvLoading" class="fv-loading">Loading...</div>
    </div>
  </section>

  {% include "_ts_settings_modal.html" %}

  <script>
    window.FV_TICKER = "{{ ticker }}";
  </script>
  <script src="/static/autocomplete.js?v={{ asset_v }}"></script>
  <script type="module" src="/static/ts_settings.js?v={{ asset_v }}"></script>
  <script src="/static/fair_value.js?v={{ asset_v }}"></script>
</body>
</html>
